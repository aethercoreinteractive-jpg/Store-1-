<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Admin Control Center</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }

        /* Login Screen */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(32, 33, 36, 0.9); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .login-card {
            background: var(--card-bg); width: 100%; max-width: 380px; padding: 30px;
            border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; font-size: 1.5rem; color: var(--text); }
        
        .password-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .password-wrapper input { width: 100%; padding: 12px 42px 12px 16px; margin-bottom: 0; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: #fff; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-light); z-index: 10; }

        /* Main Layout */
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; color: var(--text); font-weight: 800; }

        /* Store Status Toggle Switch */
        .store-status-bar { display: flex; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; margin-top: 10px; }
        .store-status-label { font-weight: 700; font-size: 0.95rem; }
        
        .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Form Controls */
        input, textarea, select { width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary { background: var(--kfc-red); color: white; }
        .btn-primary:hover { background: var(--kfc-red-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #e4e4e7; color: var(--text); }

        /* Product Mobile List Cards */
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fafafa; }
        .product-info h4 { font-size: 0.95rem; color: var(--text); }
        .product-info p { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
        .category-tag { display: inline-block; background: #fee2e2; color: var(--kfc-red); font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; text-transform: uppercase; }
        .product-actions { display: flex; gap: 6px; }

        /* Orders Mobile Cards */
        .order-card { background: #fafafa; border: 1px solid var(--border); padding: 14px; border-radius: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1rem; }
        .order-details { font-size: 0.85rem; color: var(--text-light); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-preparing { background: #e0e7ff; color: #4f46e5; }
        .badge-ready { background: #d1fae5; color: #059669; }

        .form-row { display: flex; gap: 8px; }
        .input-with-eye { position: relative; width: 100%; margin-bottom: 12px; }
        .input-with-eye input { margin-bottom: 0; padding-right: 42px; }
        .input-with-eye .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-light); z-index: 10; }
        
        .action-container { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>🔐 Admin Portal</h2>
            <div class="password-wrapper">
                <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password">
                <button type="button" id="toggleLoginPass" class="toggle-password">👁️</button>
            </div>
            <button type="button" id="manualLoginBtn" class="btn btn-primary">Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="adminContent" class="container" style="display:none;">
        <header>
            <h1>🍗 Quick<span>Admin</span></h1>
            <button id="logoutBtn" class="btn btn-danger" style="width: auto; padding: 8px 14px; font-size: 0.85rem;">Logout</button>
        </header>

        <!-- STORE STATUS & STARTING ORDER NUMBER CONTROL -->
        <div class="card" style="padding-bottom: 16px;">
            <h2>🏪 Store Operations</h2>
            <label style="font-size: 0.85rem; color: var(--text-light); display: block; margin-bottom: 6px;">Starting Order Number (Resets when store opens):</label>
            <input type="number" id="startOrderNumInput" value="200" placeholder="e.g. 200, 300, 400">
            
            <div class="store-status-bar">
                <span class="store-status-label" id="storeStatusText">Store is CLOSED</span>
                <label class="switch">
                    <input type="checkbox" id="storeToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- PRODUCT MANAGEMENT -->
        <div class="card">
            <h2>📦 Product Control</h2>
            <input type="hidden" id="editProductId">
            <input type="text" id="productName" placeholder="Product Name">
            <input type="text" id="productCategory" placeholder="Category (e.g. Burgers, Chicken, Drinks)">
            <textarea id="productDesc" placeholder="Product Description"></textarea>
            <input type="number" id="productPrice" placeholder="Price (₹)">
            <input type="text" id="productImage" placeholder="Google Drive Image Link">
            
            <div class="form-row">
                <button class="btn btn-primary" id="saveBtn">Add Product</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
            </div>

            <h3 style="font-size: 0.95rem; margin: 20px 0 10px 0; color: var(--text-light);">Inventory Items</h3>
            <div id="productListContainer">Loading inventory...</div>
        </div>

        <!-- ORDERS & QUEUE WORKFLOW -->
        <div class="card">
            <h2>🔥 Live Orders <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-light);">(Max 3 Preparing)</span></h2>
            <div id="ordersContainer">Loading live orders...</div>
        </div>

        <!-- SETTINGS PANEL -->
        <div class="card">
            <h2>⚙️ Settings</h2>
            <div class="input-with-eye">
                <input type="password" id="currentPass" placeholder="Current Password">
                <button type="button" class="toggle-password" data-target="currentPass">👁️</button>
            </div>
            <div class="input-with-eye">
                <input type="password" id="newPass" placeholder="New Password (Min 4 chars)">
                <button type="button" class="toggle-password" data-target="newPass">👁️</button>
            </div>
            <button class="btn btn-secondary" id="updatePassBtn">Update Password</button>
        </div>
    </div>

    <!-- NON-MODULE GLOBAL SCRIPTS FOR IMMEDIATE UI INTERACTION -->
    <script>
        if (!localStorage.getItem("adminPassword")) {
            localStorage.setItem("adminPassword", "Admin@123");
        }

        // Global Eye Toggle Handler
        document.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('.toggle-password');
            if (!toggleBtn) return;

            if (toggleBtn.id === 'toggleLoginPass') {
                const inputField = document.getElementById('adminPasswordInput');
                if (inputField) {
                    if (inputField.type === "password") {
                        inputField.type = "text";
                        toggleBtn.textContent = "🙈";
                    } else {
                        inputField.type = "password";
                        toggleBtn.textContent = "👁️";
                    }
                }
            } else {
                const targetId = toggleBtn.getAttribute('data-target');
                if (targetId) {
                    const inputField = document.getElementById(targetId);
                    if (inputField) {
                        if (inputField.type === "password") {
                            inputField.type = "text";
                            toggleBtn.textContent = "🙈";
                        } else {
                            inputField.type = "password";
                            toggleBtn.textContent = "👁️";
                        }
                    }
                }
            }
        });

        // Global Login Handler
        function handleLoginAction() {
            const passwordInput = document.getElementById('adminPasswordInput');
            const inputVal = passwordInput.value;
            const currentStoredPass = localStorage.getItem("adminPassword") || "Admin@123";

            if (inputVal === currentStoredPass) {
                sessionStorage.setItem("adminLoggedIn", "true");
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'flex';
                if (window.initAdminDashboard) {
                    window.initAdminDashboard();
                }
            } else {
                alert("Incorrect password! Please check your password (Default is Admin@123).");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("adminLoggedIn") === "true") {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'flex';
                if (window.initAdminDashboard) {
                    window.initAdminDashboard();
                }
            }

            const manualLoginBtn = document.getElementById('manualLoginBtn');
            if (manualLoginBtn) {
                manualLoginBtn.addEventListener('click', handleLoginAction);
            }

            const passwordInput = document.getElementById('adminPasswordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleLoginAction();
                    }
                });
                passwordInput.addEventListener('input', function() {
                    const currentStoredPass = localStorage.getItem("adminPassword") || "Admin@123";
                    if (this.value === currentStoredPass) {
                        handleLoginAction();
                    }
                });
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    sessionStorage.removeItem("adminLoggedIn");
                    document.getElementById('adminContent').style.display = 'none';
                    document.getElementById('loginOverlay').style.display = 'flex';
                    if (passwordInput) passwordInput.value = "";
                });
            }
        });
    </script>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.initAdminDashboard = function() {
            loadProducts();
            initStoreStatus();
            initOrderListener();
        }

        // --- STORE OPEN/CLOSED & COUNTER SYNC ---
        async function initStoreStatus() {
            const storeRef = doc(db, "settings", "storeStatus");
            const snap = await getDoc(storeRef);
            
            if (snap.exists()) {
                const data = snap.data();
                const isOpen = data.isOpen || false;
                document.getElementById('storeToggle').checked = isOpen;
                if (data.customStartNumber) {
                    document.getElementById('startOrderNumInput').value = data.customStartNumber;
                }
                updateStatusLabel(isOpen);
            } else {
                await setDoc(storeRef, { isOpen: false, nextOrderNumber: 200, customStartNumber: 200 });
                document.getElementById('storeToggle').checked = false;
                document.getElementById('startOrderNumInput').value = 200;
                updateStatusLabel(false);
            }
        }

        document.getElementById('storeToggle').addEventListener('change', async function() {
            const isChecked = this.checked;
            const customStart = parseInt(document.getElementById('startOrderNumInput').value) || 200;
            const storeRef = doc(db, "settings", "storeStatus");

            if (isChecked) {
                await setDoc(storeRef, { 
                    isOpen: true, 
                    nextOrderNumber: customStart, 
                    customStartNumber: customStart 
                });
                alert(`Store is now OPEN. Order sequence reset to start from ${customStart}.`);
            } else {
                await setDoc(storeRef, { isOpen: false }, { merge: true });
                alert("Store is now CLOSED. Customers will see a professional closed notification.");
            }
            updateStatusLabel(isChecked);
        });

        function updateStatusLabel(isOpen) {
            const label = document.getElementById('storeStatusText');
            if (isOpen) {
                label.innerText = "Store is OPEN (Accepting Orders)";
                label.style.color = "var(--success)";
            } else {
                label.innerText = "Store is CLOSED";
                label.style.color = "var(--danger)";
            }
        }

        document.getElementById('updatePassBtn').addEventListener('click', function() {
            const currentInput = document.getElementById('currentPass').value;
            const newInput = document.getElementById('newPass').value;
            if (currentInput !== localStorage.getItem("adminPassword")) {
                alert("Incorrect current password!");
                return;
            }
            if (!newInput || newInput.length < 4) {
                alert("Password must be at least 4 characters long.");
                return;
            }
            localStorage.setItem("adminPassword", newInput);
            alert("Password updated successfully!");
            document.getElementById('currentPass').value = "";
            document.getElementById('newPass').value = "";
        });

        // --- PRODUCT CRUD ---
        document.getElementById('saveBtn').addEventListener('click', async function() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value || 'General';
            const description = document.getElementById('productDesc').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;

            if (!name || !price) {
                alert("Please provide at least a Product Name and Price.");
                return;
            }

            try {
                if (id) {
                    await updateDoc(doc(db, "products", id), { name, category, description, price, image });
                    alert("Product updated successfully!");
                } else {
                    await addDoc(collection(db, "products"), { name, category, description, price, image });
                    alert("Product added successfully!");
                }
                clearProductForm();
                loadProducts();
            } catch (e) {
                console.error("Error saving product: ", e);
            }
        });

        async function loadProducts() {
            const container = document.getElementById('productListContainer');
            container.innerHTML = "";
        const querySnapshot = await getDocs(collection(db, "products"));
            
            if (querySnapshot.empty) {
                container.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem;'>No products added yet.</p>";
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const itemDiv = document.createElement('div');
                itemDiv.className = "product-item";
                itemDiv.innerHTML = `
                    <div class="product-info">
                        <span class="category-tag">${p.category || 'General'}</span>
                        <h4>${p.name} (₹${p.price})</h4>
                        <p>${p.description ? p.description.substring(0, 40) + '...' : 'No description'}</p>
                    </div>
                    <div class="product-actions">
                        <button class="edit-btn" style="background:#e0e7ff; color:#4f46e5; padding:6px 12px; font-size:0.8rem; border-radius:6px; border:none; cursor:pointer; font-weight:600;">Edit</button>
                        <button class="del-btn" style="background:#fee2e2; color:#ef4444; padding:6px 12px; font-size:0.8rem; border-radius:6px; border:none; cursor:pointer; font-weight:600;">Delete</button>
                    </div>
                `;

                itemDiv.querySelector('.edit-btn').addEventListener('click', () => {
                    document.getElementById('editProductId').value = docSnap.id;
                    document.getElementById('productName').value = p.name;
                    document.getElementById('productCategory').value = p.category || '';
                    document.getElementById('productDesc').value = p.description || '';
                    document.getElementById('productPrice').value = p.price;
                    document.getElementById('productImage').value = p.image || '';
                    
                    document.getElementById('saveBtn').innerText = "Update Product";
                    document.getElementById('cancelEditBtn').style.display = "block";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                itemDiv.querySelector('.del-btn').addEventListener('click', async () => {
                    if (confirm("Are you sure you want to delete this product?")) {
                        await deleteDoc(doc(db, "products", docSnap.id));
                        loadProducts();
                    }
                });

                container.appendChild(itemDiv);
            });
        }

        document.getElementById('cancelEditBtn').addEventListener('click', clearProductForm);

        function clearProductForm() {
            document.getElementById('editProductId').value = "";
            document.getElementById('productName').value = "";
            document.getElementById('productCategory').value = "";
            document.getElementById('productDesc').value = "";
            document.getElementById('productPrice').value = "";
            document.getElementById('productImage').value = "";
            document.getElementById('saveBtn').innerText = "Add Product";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        // --- ORDER QUEUE WORKFLOW ---
        function initOrderListener() {
            onSnapshot(collection(db, "orders"), (snapshot) => {
                const container = document.getElementById('ordersContainer');
                container.innerHTML = "";

                let orders = [];
                snapshot.forEach(docSnap => {
                    orders.push({ id: docSnap.id, ...docSnap.data() });
                });

                const preparingCount = orders.filter(o => o.status === "preparing").length;

                if (orders.length === 0) {
                    container.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem;'>No active customer orders.</p>";
                    return;
                }

                orders.forEach(order => {
                    let badgeClass = "badge-pending";
                    let actionHtml = "";

                    const orderCard = document.createElement('div');
                    orderCard.className = "order-card";

                    if (order.status === "pending") {
                        if (preparingCount < 3) {
                            actionHtml = `
                                <button class="btn btn-primary accept-btn" style="padding:8px; font-size:0.85rem;">Accept Order</button>
                                <button class="btn btn-danger decline-btn" style="padding:8px; font-size:0.85rem;">Decline Order</button>
                            `;
                        } else {
                            actionHtml = `
                                <span style="color:var(--warning); font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Queue Full (Max 3 Preparing)</span>
                                <button class="btn btn-danger decline-btn" style="padding:8px; font-size:0.85rem;">Decline Order</button>
                            `;
                        }
                    } else if (order.status === "preparing") {
                        badgeClass = "badge-preparing";
                        actionHtml = `<button class="btn btn-success ready-btn" style="padding:8px; font-size:0.85rem;">Mark as Ready</button>`;
                    } else if (order.status === "ready") {
                        badgeClass = "badge-ready";
                        actionHtml = `<button class="btn btn-primary picked-btn" style="padding:8px; font-size:0.85rem; background: var(--kfc-dark);">Mark as Picked</button>`;
                    }

                    orderCard.innerHTML = `
                        <div class="order-header">
                            <span>Order #${order.orderNumber}</span>
                            <span class="badge ${badgeClass}">${order.status}</span>
                        </div>
                        <div class="order-details">
                            <strong>Item:</strong> ${order.productName || 'Custom Item'} (${order.price ? '₹' + order.price : ''})
                        </div>
                        <div class="action-container"></div>
                    `;

                    const actionContainer = orderCard.querySelector('.action-container');
                    actionContainer.innerHTML = actionHtml;

                    if (order.status === "pending") {
                        if (preparingCount < 3) {
                            actionContainer.querySelector('.accept-btn').addEventListener('click', async () => {
                                await updateDoc(doc(db, "orders", order.id), { status: "preparing" });
                            });
                        }
                        actionContainer.querySelector('.decline-btn').addEventListener('click', async () => {
                            if (confirm(`Are you sure you want to decline Order #${order.orderNumber}?`)) {
                                await updateDoc(doc(db, "orders", order.id), { status: "declined" });
                            }
                        });
                    } else if (order.status === "preparing") {
                        actionContainer.querySelector('.ready-btn').addEventListener('click', async () => {
                            await updateDoc(doc(db, "orders", order.id), { status: "ready" });
                        });
                    } else if (order.status === "ready") {
                        actionContainer.querySelector('.picked-btn').addEventListener('click', async () => {
                            if (confirm("Has the customer picked up this order? This will clear it from the live queue.")) {
                                await deleteDoc(doc(db, "orders", order.id));
                            }
                        });
                    }

                    container.appendChild(orderCard);
                });
            });
        }
    </script>
</body>
</html>
