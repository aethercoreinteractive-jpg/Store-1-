<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Order History</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        .back-btn {
            background: #f4f4f5; color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #e4e4e7; }

        /* Filter Tab Bar */
        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .filter-tab {
            background: #f4f4f5;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-tab:hover { background: #e4e4e7; }
        .filter-tab.active {
            background: var(--kfc-red);
            color: white;
            border-color: var(--kfc-red);
        }

        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text); font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

        .date-section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--kfc-dark);
            background: #e4e4e7;
            padding: 6px 12px;
            border-radius: 8px;
            margin: 16px 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-card { 
            background: #fafafa; border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; 
            display: flex; flex-direction: column; gap: 4px; 
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.95rem; }
        .history-details { font-size: 0.85rem; color: var(--text-light); display: flex; justify-content: space-between; }
        
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-ready, .badge-picked { background: #d1fae5; color: #059669; }
        .badge-declined { background: #fee2e2; color: var(--danger); }
        .badge-completed { background: #e0e7ff; color: #4f46e5; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🍗 Quick<span>History</span></h1>
            <a href="testmerchandise.html" class="back-btn">⬅ Back to Admin</a>
        </header>

        <div class="card">
            <h2>📜 Complete Archive</h2>
            
            <!-- Dynamic Filter Tabs -->
            <div id="filterTabsContainer" class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All Time</button>
                <button class="filter-tab" data-filter="Today">Today</button>
                <button class="filter-tab" data-filter="Yesterday">Yesterday</button>
            </div>

            <div id="historyContainer">Loading order history...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentFilter = "all";
        let globalOrdersCache = [];

        function getDateCategory(dateString) {
            if (!dateString) return "Archive";
            
            const orderDate = new Date(dateString);
            const today = new Date();
            
            const isToday = orderDate.toDateString() === today.toDateString();
            
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            const isYesterday = orderDate.toDateString() === yesterday.toDateString();

            if (isToday) return "Today";
            if (isYesterday) return "Yesterday";
            
            return orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTime(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function renderOrders() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = "";

            let ordersToDisplay = [...globalOrdersCache];

            if (currentFilter !== "all") {
                ordersToDisplay = ordersToDisplay.filter(order => getDateCategory(order.timestamp) === currentFilter);
            }

            if (ordersToDisplay.length === 0) {
                container.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem; padding: 10px 0;'>No orders found for this selection.</p>";
                return;
            }

            let groupedOrders = {};
            ordersToDisplay.forEach(order => {
                const category = getDateCategory(order.timestamp);
                if (!groupedOrders[category]) {
                    groupedOrders[category] = [];
                }
                groupedOrders[category].push(order);
            });

            const sortedKeys = Object.keys(groupedOrders).sort((a, b) => {
                if (a === "Today") return -1;
                if (b === "Today") return 1;
                if (a === "Yesterday") return -1;
                if (b === "Yesterday") return 1;
                return new Date(b) - new Date(a);
            });

            sortedKeys.forEach(dateKey => {
                if (currentFilter === "all") {
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = "date-section-title";
                    sectionHeader.innerHTML = `<span>📅 ${dateKey}</span> <span style="font-size:0.75rem; font-weight:normal; color:var(--text-light);">${groupedOrders[dateKey].length} orders</span>`;
                    container.appendChild(sectionHeader);
                }

                groupedOrders[dateKey].forEach(order => {
                    const historyCard = document.createElement('div');
                    historyCard.className = "history-card";
                    historyCard.innerHTML = `
                        <div class="history-header">
                            <span>Order #${order.orderNumber || '---'}</span>
                            <span class="badge badge-${order.status || 'completed'}">${order.status || 'completed'}</span>
                        </div>
                        <div class="history-details">
                            <span><strong>${order.productName || 'Custom Item'}</strong> (${order.price ? '₹' + order.price : ''})</span>
                            <span style="color: var(--text-light);">${formatTime(order.timestamp)}</span>
                        </div>
                    `;
                    container.appendChild(historyCard);
                });
            });
        }

        function updateFilterTabsDynamic(orders) {
            const tabsContainer = document.getElementById('filterTabsContainer');
            
            // Collect unique dates present in records
            let uniqueDatesMap = new Set();
            orders.forEach(o => {
                const cat = getDateCategory(o.timestamp);
                if (cat !== "Today" && cat !== "Yesterday" && cat !== "Archive") {
                    uniqueDatesMap.add(cat);
                }
            });

            // Keep 'All Time', 'Today', 'Yesterday', then append past dates
            let tabsHtml = `
                <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">All Time</button>
                <button class="filter-tab ${currentFilter === 'Today' ? 'active' : ''}" data-filter="Today">Today</button>
                <button class="filter-tab ${currentFilter === 'Yesterday' ? 'active' : ''}" data-filter="Yesterday">Yesterday</button>
            `;

            uniqueDatesMap.forEach(dateStr => {
                tabsHtml += `<button class="filter-tab ${currentFilter === dateStr ? 'active' : ''}" data-filter="${dateStr}">${dateStr}</button>`;
            });

            tabsContainer.innerHTML = tabsHtml;

            // Re-bind click events
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.getAttribute('data-filter');
                    renderOrders();
                });
            });
        }

        onSnapshot(collection(db, "orders"), (snapshot) => {
            globalOrdersCache = [];
            snapshot.forEach(docSnap => {
                globalOrdersCache.push({ id: docSnap.id, ...docSnap.data() });
            });

            globalOrdersCache.sort((a, b) => {
                const timeA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                const timeB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                return timeB - timeA;
            });

            updateFilterTabsDynamic(globalOrdersCache);
            renderOrders();
        });
    </script>
</body>
</html>
