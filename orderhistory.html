<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Order History</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .back-btn {
            background: #f4f4f5; color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #e4e4e7; }

        .btn-danger { 
            background: var(--danger); color: white; border: none; 
            padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; 
            font-weight: 700; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-danger:hover { opacity: 0.9; }

        /* Filter Tab Bar */
        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .filter-tab {
            background: #f4f4f5;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-tab:hover { background: #e4e4e7; }
        .filter-tab.active {
            background: var(--kfc-red);
            color: white;
            border-color: var(--kfc-red);
        }

        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text); font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

        .date-section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--kfc-dark);
            background: #e4e4e7;
            padding: 6px 12px;
            border-radius: 8px;
            margin: 16px 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-card { 
            background: #fafafa; border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; 
            display: flex; flex-direction: column; gap: 4px; 
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.95rem; }
        .history-details { font-size: 0.85rem; color: var(--text-light); display: flex; justify-content: space-between; }
        
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-ready, .badge-picked { background: #d1fae5; color: #059669; }
        .badge-declined { background: #fee2e2; color: var(--danger); }
        .badge-completed { background: #e0e7ff; color: #4f46e5; }

        /* Custom Website Modal Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: none; justify-content: center;
            align-items: center; z-index: 1000; padding: 16px;
        }
        .modal-card {
            background: var(--card-bg); width: 100%; max-width: 360px;
            padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--border);
        }
        .modal-card h3 { font-size: 1rem; font-weight: 800; color: var(--text); }
        .modal-card p { font-size: 0.85rem; color: var(--text-light); }
        .modal-input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.9rem; outline: none; background: #fafafa;
        }
        .modal-input:focus { border-color: var(--kfc-red); background: #fff; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
        .modal-btn {
            padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none;
        }
        .modal-btn-cancel { background: #f4f4f5; color: var(--text); border: 1px solid var(--border); }
        .modal-btn-confirm { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>History</h1>
            <div class="header-actions">
                <button id="clearHistoryBtn" class="btn-danger">Clear History</button>
                <button onclick="history.back();" class="back-btn">⬅ Back</button>
            </div>
        </header>

        <div class="card">
            <h2>📜 Permanent Archive</h2>
            
            <!-- Dynamic Filter Tabs: Yesterday, Today, All Time -->
            <div id="filterTabsContainer" class="filter-tabs">
                <button class="filter-tab" data-filter="Yesterday">Yesterday</button>
                <button class="filter-tab active" data-filter="Today">Today</button>
                <button class="filter-tab" data-filter="all">All Time</button>
            </div>

            <div id="historyContainer">Loading permanent order history...</div>
        </div>
    </div>

    <!-- Custom Website Modal Popup -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modalTitle">Admin Authorization</h3>
            <p id="modalDesc">Enter Admin Password to clear order history archive:</p>
            <input type="password" id="modalPasswordInput" class="modal-input" placeholder="Password..." style="display:none;">
            <div class="modal-actions">
                <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Cancel</button>
                <button id="modalConfirmBtn" class="modal-btn modal-btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentFilter = "Today";
        let globalOrdersCache = [];

        function getDateCategory(dateString) {
            if (!dateString) return "Archive";
            const orderDate = new Date(dateString);
            const today = new Date();
            const isToday = orderDate.toDateString() === today.toDateString();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            const isYesterday = orderDate.toDateString() === yesterday.toDateString();

            if (isToday) return "Today";
            if (isYesterday) return "Yesterday";
            return orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatTime(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function renderOrders() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = "";

            let ordersToDisplay = [...globalOrdersCache];

            if (currentFilter !== "all") {
                ordersToDisplay = ordersToDisplay.filter(order => getDateCategory(order.timestamp) === currentFilter);
            }

            if (ordersToDisplay.length === 0) {
                container.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem; padding: 10px 0;'>No orders found for this selection.</p>";
                return;
            }

            let groupedOrders = {};
            ordersToDisplay.forEach(order => {
                const category = getDateCategory(order.timestamp);
                if (!groupedOrders[category]) {
                    groupedOrders[category] = [];
                }
                groupedOrders[category].push(order);
            });

            const sortedKeys = Object.keys(groupedOrders).sort((a, b) => {
                if (a === "Yesterday") return -1;
                if (b === "Yesterday") return 1;
                if (a === "Today") return -1;
                if (b === "Today") return 1;
                return new Date(b) - new Date(a);
            });

            sortedKeys.forEach(dateKey => {
                if (currentFilter === "all") {
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = "date-section-title";
                    sectionHeader.innerHTML = `<span>📅 ${dateKey}</span> <span style="font-size:0.75rem; font-weight:normal; color:var(--text-light);">${groupedOrders[dateKey].length} orders</span>`;
                    container.appendChild(sectionHeader);
                }

                groupedOrders[dateKey].forEach(order => {
                    const historyCard = document.createElement('div');
                    historyCard.className = "history-card";
                    historyCard.innerHTML = `
                        <div class="history-header">
                            <span>Order #${order.orderNumber || '---'}</span>
                            <span class="badge badge-${order.status || 'completed'}">${order.status || 'completed'}</span>
                        </div>
                        <div class="history-details">
                            <span><strong>${order.productName || 'Custom Item'}</strong> (${order.price ? '₹' + order.price : ''})</span>
                            <span style="color: var(--text-light);">${formatTime(order.timestamp)}</span>
                        </div>
                    `;
                    container.appendChild(historyCard);
                });
            });
        }

        function updateFilterTabsDynamic(orders) {
            const tabsContainer = document.getElementById('filterTabsContainer');
            let uniqueDatesMap = new Set();
            orders.forEach(o => {
                const cat = getDateCategory(o.timestamp);
                if (cat !== "Today" && cat !== "Yesterday" && cat !== "Archive") {
                    uniqueDatesMap.add(cat);
                }
            });

            let tabsHtml = `
                <button class="filter-tab ${currentFilter === 'Yesterday' ? 'active' : ''}" data-filter="Yesterday">Yesterday</button>
                <button class="filter-tab ${currentFilter === 'Today' ? 'active' : ''}" data-filter="Today">Today</button>
            `;

            uniqueDatesMap.forEach(dateStr => {
                tabsHtml += `<button class="filter-tab ${currentFilter === dateStr ? 'active' : ''}" data-filter="${dateStr}">${dateStr}</button>`;
            });

            tabsHtml += `<button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">All Time</button>`;
            tabsContainer.innerHTML = tabsHtml;

            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.getAttribute('data-filter');
                    renderOrders();
                });
            });
        }

        // Custom Modal Workflow Logic
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalPasswordInput = document.getElementById('modalPasswordInput');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        let modalStep = 'password';

        clearHistoryBtn.addEventListener('click', () => {
            modalStep = 'password';
            modalTitle.textContent = "Admin Authorization";
            modalDesc.textContent = "Enter Admin Password to clear order history archive:";
            modalPasswordInput.value = "";
            modalPasswordInput.style.display = "block";
            modalConfirmBtn.textContent = "Confirm";
            modal.style.display = "flex";
            modalPasswordInput.focus();
        });

        modalCancelBtn.addEventListener('click', () => {
            modal.style.display = "none";
        });

        modalConfirmBtn.addEventListener('click', async () => {
            if (modalStep === 'password') {
                const enteredPassword = modalPasswordInput.value;
                const storedPassword = localStorage.getItem("adminPassword") || "admin123";

                if (enteredPassword !== storedPassword) {
                    modalDesc.textContent = "Incorrect password! Try again:";
                    modalPasswordInput.value = "";
                    return;
                }

                modalStep = 'confirm';
                modalTitle.textContent = "Are you sure?";
                modalDesc.textContent = "This will permanently delete all saved order history archive records. This action cannot be undone.";
                modalPasswordInput.style.display = "none";
                modalConfirmBtn.textContent = "Yes, Clear All";
            } else if (modalStep === 'confirm') {
                modal.style.display = "none";
                try {
                    const querySnapshot = await getDocs(collection(db, "orderHistory"));
                    const deletePromises = querySnapshot.docs.map(documentSnapshot => 
                        deleteDoc(doc(db, "orderHistory", documentSnapshot.id))
                    );
                    await Promise.all(deletePromises);
                    
                    const container = document.getElementById('historyContainer');
                    container.innerHTML = "<p style='color:var(--success); font-size:0.85rem; padding: 10px 0; font-weight:700;'>Order history archive cleared successfully.</p>";
                } catch (error) {
                    console.error("Error clearing history:", error);
                    alert("Failed to clear history. Check console for details.");
                }
            }
        });

        onSnapshot(collection(db, "orderHistory"), (snapshot) => {
            globalOrdersCache = [];
            snapshot.forEach(docSnap => {
                globalOrdersCache.push({ id: docSnap.id, ...docSnap.data() });
            });

            globalOrdersCache.sort((a, b) => {
                const timeA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
                const timeB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
                return timeB - timeA;
            });

            updateFilterTabsDynamic(globalOrdersCache);
            renderOrders();
        });
    </script>
</body>
</html>
