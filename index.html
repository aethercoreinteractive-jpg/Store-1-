<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Menu & Ordering</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 80px; }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        header { background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: relative; }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        /* Gear Icon & Menu Dropdown */
        .settings-menu-container { position: relative; }
        .gear-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .gear-btn:hover { background: rgba(255,255,255,0.2); }
        
        .dropdown-content { display: none; position: absolute; right: 0; top: 45px; background: white; min-width: 140px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; z-index: 100; }
        .dropdown-content a { color: var(--text); padding: 10px 14px; text-decoration: none; display: block; font-size: 0.85rem; font-weight: 600; }
        .dropdown-content a:hover { background: #f4f4f5; color: var(--kfc-red); }
        .dropdown-content.show { display: block; }

        .store-alert { padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; text-align: center; }
        .store-alert.closed { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .store-alert.open { background: #d1fae5; color: var(--success); border: 1px solid #a7f3d0; }

        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; font-weight: 800; }

        /* Menu Item Layout */
        .menu-item { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fafafa; align-items: center; }
        .menu-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #e4e4e7; flex-shrink: 0; }
        .menu-details { flex-grow: 1; }
        .category-tag { display: inline-block; background: #fee2e2; color: var(--kfc-red); font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; text-transform: uppercase; }
        .menu-details h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); }
        .menu-details p { font-size: 0.75rem; color: var(--text-light); margin: 2px 0 6px 0; line-height: 1.2; }
        .price { font-weight: 800; font-size: 0.9rem; color: var(--text); }

        .btn { width: 100%; padding: 10px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary { background: var(--kfc-red); color: white; }
        .btn-primary:hover { background: var(--kfc-red-hover); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Order Status Panel */
        .live-order-card { background: #fafafa; border: 1px solid var(--border); padding: 14px; border-radius: 12px; margin-top: 10px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-preparing { background: #e0e7ff; color: #4f46e5; }
        .badge-ready { background: #d1fae5; color: #059669; }
        .badge-declined { background: #fee2e2; color: var(--danger); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🍗 Quick<span>Bites</span></h1>
            
            <!-- GEAR ICON WITH ADMIN DROPDOWN -->
            <div class="settings-menu-container">
                <button type="button" class="gear-btn" id="gearBtn" title="Settings">⚙️</button>
                <div id="adminDropdown" class="dropdown-content">
                    <a href="admin.html">🔐 Admin Login</a>
                </div>
            </div>
        </header>

        <!-- STORE STATUS BANNER -->
        <div id="storeAlertContainer">
            <div class="store-alert closed">Checking store status...</div>
        </div>

        <!-- MENU LIST -->
        <div class="card">
            <h2>📜 Our Menu</h2>
            <div id="menuContainer">Loading menu...</div>
        </div>

        <!-- LIVE ORDER TRACKER -->
        <div class="card" id="trackerCard" style="display:none;">
            <h2>🔔 Your Live Order</h2>
            <div id="trackerContainer"></div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isStoreOpen = false;

        // --- GEAR DROPDOWN TOGGLE INTERACTION ---
        const gearBtn = document.getElementById('gearBtn');
        const adminDropdown = document.getElementById('adminDropdown');

        gearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            adminDropdown.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            if (adminDropdown.classList.contains('show')) {
                adminDropdown.classList.remove('show');
            }
        });

        // --- CHECK STORE STATUS & LISTEN TO CHANGES ---
        function initStoreListener() {
            onSnapshot(doc(db, "settings", "storeStatus"), (docSnap) => {
                const alertContainer = document.getElementById('storeAlertContainer');
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    isStoreOpen = data.isOpen || false;

                    if (isStoreOpen) {
                        alertContainer.innerHTML = `<div class="store-alert open">🟢 Store is OPEN! Place your orders below.</div>`;
                    } else {
                        alertContainer.innerHTML = `<div class="store-alert closed">🔴 Store is currently CLOSED. We are not accepting orders right now.</div>`;
                    }
                    loadMenu();
                } else {
                    alertContainer.innerHTML = `<div class="store-alert closed">🔴 Store status unavailable.</div>`;
                }
            });
        }

        // --- CONVERT GOOGLE DRIVE LINK TO DIRECT EMBED IMAGE URL ---
        function getDirectImageUrl(url) {
            if (!url) return "https://via.placeholder.com/70?text=No+Image";
            const match = url.match(/\/d\/(.*?)\/view/) || url.match(/id=([^&]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        // --- LOAD MENU ITEMS ---
        async function loadMenu() {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = "";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    menuContainer.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem;'>No menu items available at the moment.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const directImg = getDirectImageUrl(p.image);
                    
                    menuContainer.innerHTML += `
                        <div class="menu-item">
                            <img src="${directImg}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/70?text=Food'">
                            <div class="menu-details">
                                <span class="category-tag">${p.category || 'General'}</span>
                                <h3>${p.name}</h3>
                                <p>${p.description || 'Delicious meal item prepared fresh.'}</p>
                                <div class="price">₹${p.price}</div>
                            </div>
                            <button class="btn btn-primary" style="width: auto; padding: 8px 14px; font-size: 0.85rem;" 
                                ${!isStoreOpen ? 'disabled' : ''} 
                                onclick="placeOrder('${p.name}', '${p.price}')">
                                ${isStoreOpen ? 'Order' : 'Closed'}
                            </button>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading menu: ", e);
                menuContainer.innerHTML = "<p style='color:var(--danger); font-size:0.85rem;'>Failed to load menu items.</p>";
            }
        }

        // --- PLACE ORDER WITH AUTO-INCREMENTING ORDER NUMBER ---
        window.placeOrder = async function(productName, price) {
            if (!isStoreOpen) {
                alert("Sorry, the store is closed and cannot accept orders.");
                return;
            }

            if (!confirm(`Confirm order for ${productName} (₹${price})?`)) return;

            try {
                const storeRef = doc(db, "settings", "storeStatus");
                const storeSnap = await getDoc(storeRef);
                
                let currentOrderNum = 200;
                if (storeSnap.exists() && storeSnap.data().nextOrderNumber) {
                    currentOrderNum = storeSnap.data().nextOrderNumber;
                }

                await addDoc(collection(db, "orders"), {
                    orderNumber: currentOrderNum,
                    productName: productName,
                    price: price,
                    status: "pending",
                    createdAt: new Date().toISOString()
                });

                await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(async ({ updateDoc }) => {
                    await updateDoc(storeRef, { nextOrderNumber: currentOrderNum + 1 });
                });

                alert(`Order placed successfully! Your Order Number is #${currentOrderNum}`);
                
                localStorage.setItem("lastActiveOrderNum", currentOrderNum);
                initLiveTracker(currentOrderNum);

            } catch (e) {
                console.error("Error placing order: ", e);
                alert("Failed to place order. Please try again.");
            }
        }

        // --- REAL-TIME ORDER TRACKING ---
        function initLiveTracker(targetOrderNum) {
            const trackerCard = document.getElementById('trackerCard');
            const trackerContainer = document.getElementById('trackerContainer');
            
            trackerCard.style.display = "block";

            onSnapshot(collection(db, "orders"), (snapshot) => {
                let foundOrder = null;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.orderNumber == targetOrderNum) {
                        foundOrder = data;
                    }
                });

                if (!foundOrder) {
                    // Check if the order was declined (deleted from active orders) vs completed
                    // If it was previously tracked, we can check a separate logs collection or handle state gently.
                    // For safety, let's verify localStorage to show the decline message if it vanished abruptly.
                    trackerContainer.innerHTML = `<p style="color:var(--success); font-size:0.85rem; font-weight:600;">✅ Order #${targetOrderNum} has been completed and picked up! Thank you.</p>`;
                    return;
                }

                let badgeClass = "badge-pending";
                let statusText = "Pending Confirmation from Kitchen";
                if (foundOrder.status === "preparing") {
                    badgeClass = "badge-preparing";
                    statusText = "Kitchen is Preparing your Order 🔥";
                } else if (foundOrder.status === "ready") {
                    badgeClass = "badge-ready";
                    statusText = "Ready for Counter Pickup! 🎉";
                } else if (foundOrder.status === "declined") {
                    badgeClass = "badge-declined";
                    statusText = "Order Declined by Admin";
                }

                if (foundOrder.status === "declined") {
                    trackerContainer.innerHTML = `
                        <div class="live-order-card" style="border-color: #fecaca; background: #fff5f5;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; font-weight:700;">
                                <span>Order #${foundOrder.orderNumber}</span>
                                <span class="badge ${badgeClass}">Declined</span>
                            </div>
                            <div style="font-size:0.85rem; color:var(--text-light); margin-bottom: 8px;">
                                <strong>Item:</strong> ${foundOrder.productName} (₹${foundOrder.price})
                            </div>
                            <div style="font-size:0.9rem; font-weight:700; color:var(--danger); margin-bottom: 6px;">❌ Unfortunately, your order could not be processed at this time.</div>
                            <p style="font-size:0.8rem; color:var(--text-light); line-height: 1.4;">Please contact the associate or counter staff for assistance regarding your order.</p>
                        </div>
                    `;
                    return;
                }

                trackerContainer.innerHTML = `
                    <div class="live-order-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; font-weight:700;">
                            <span>Order #${foundOrder.orderNumber}</span>
                            <span class="badge ${badgeClass}">${foundOrder.status}</span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--text-light); margin-bottom: 6px;">
                            <strong>Item:</strong> ${foundOrder.productName} (₹${foundOrder.price})
                        </div>
                        <div style="font-size:0.9rem; font-weight:700; color:var(--kfc-red);">${statusText}</div>
                    </div>
                `;
            });
        }

        initStoreListener();
        
        const savedOrderNum = localStorage.getItem("lastActiveOrderNum");
        if (savedOrderNum) {
            initLiveTracker(savedOrderNum);
        }
    </script>
</body>
</html>
