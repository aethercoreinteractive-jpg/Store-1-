<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront - Place Order</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 50px; }

        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); }
        header p { color: var(--text-light); font-size: 0.9rem; margin-top: 4px; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media(min-width: 480px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .product-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img { width: 100%; height: 160px; object-fit: cover; background: #e2e8f0; }
        .product-content { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .product-title { font-size: 1rem; font-weight: 600; color: var(--text); }
        .product-desc { font-size: 0.85rem; color: var(--text-light); line-height: 1.4; flex-grow: 1; }
        .product-price { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-top: 4px; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        /* Order Live Tracker Box */
        #orderTrackerCard {
            display: none; margin-top: 24px; background: var(--card-bg);
            border: 2px solid var(--primary); border-radius: 16px; padding: 20px; text-align: center;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1);
        }
        #orderTrackerCard h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
        .tracker-status { font-size: 1.1rem; font-weight: 700; margin-top: 8px; }
        .status-pending { color: var(--warning); }
        .status-preparing { color: var(--primary); }
        .status-ready { color: var(--success); }

        .empty-state { text-align: center; color: var(--text-light); padding: 40px 0; font-size: 0.95rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 Quick Store</h1>
            <p>Browse available items and order instantly</p>
        </header>

        <!-- PRODUCT GRID -->
        <div class="product-grid" id="productGrid">
            <div class="empty-state">Loading products...</div>
        </div>

        <!-- LIVE ACTIVE ORDER TRACKER -->
        <div id="orderTrackerCard">
            <h2>🔔 Live Order Status</h2>
            <div id="trackerInfo"></div>
        </div>
    </div>

    <!-- Firebase SDK Scripts CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOAD PRODUCTS ---
        async function loadStoreProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            const querySnapshot = await getDocs(collection(db, "products"));
            
            if (querySnapshot.empty) {
                grid.innerHTML = `<div class="empty-state">No products available right now. Check back soon!</div>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const p = docSnap.data();
                let imgUrl = p.image ? p.image : "https://via.placeholder.com/300x160?text=No+Image";

                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${imgUrl}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x160?text=Image+Error'">
                        <div class="product-content">
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.description || 'No description provided.'}</div>
                            <div class="product-price">₹${p.price}</div>
                        </div>
                        <div style="padding: 16px; padding-top: 0;">
                            <button class="btn btn-primary" onclick="placeOrder('${p.name.replace(/'/g, "\\'")}', '${p.price}')">Order Now</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- PLACE ORDER ---
        window.placeOrder = async function(productName, productPrice) {
            const orderNumber = Math.floor(100 + Math.random() * 900); // 3-digit order token

            try {
                const docRef = await addDoc(collection(db, "orders"), {
                    orderNumber: orderNumber,
                    productName: productName,
                    price: productPrice,
                    status: "pending",
                    timestamp: new Date()
                });

                // Show & Setup Tracker Card
                const trackerCard = document.getElementById('orderTrackerCard');
                const trackerInfo = document.getElementById('trackerInfo');
                trackerCard.style.display = "block";
                trackerInfo.innerHTML = `Order <strong>#${orderNumber}</strong> (${productName})<div class="tracker-status status-pending">Status: Pending Admin Approval</div>`;
                
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

                // Listen to live changes for this specific order
                onSnapshot(doc(db, "orders", docRef.id), (docSnap) => {
                    if (docSnap.exists()) {
                        const status = docSnap.data().status;
                        if (status === "pending") {
                            trackerInfo.innerHTML = `Order <strong>#${orderNumber}</strong> (${productName})<div class="tracker-status status-pending">Status: Pending Admin Approval</div>`;
                        } else if (status === "preparing") {
                            trackerInfo.innerHTML = `Order <strong>#${orderNumber}</strong> (${productName})<div class="tracker-status status-preparing">Status: Preparing in Queue 👨‍🍳</div>`;
                        } else if (status === "ready") {
                            trackerInfo.innerHTML = `Order <strong>#${orderNumber}</strong> (${productName})<div class="tracker-status status-ready">Status: Ready for Pickup! 🎉</div>`;
                        }
                    }
                });

            } catch (e) {
                console.error("Error placing order: ", e);
                alert("Failed to place order. Please try again.");
            }
        }

        loadStoreProducts();
    </script>
</body>
</html>
