<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Welcome</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body { background: var(--kfc-dark); color: white; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* Welcome Kiosk Overlay Screen */
        .kiosk-welcome {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #18181b 0%, var(--kfc-dark) 100%);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 50px 20px; z-index: 2000; transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .kiosk-welcome.slide-up { transform: translateY(-100%); }

        .kiosk-brand { text-align: center; margin-top: 40px; }
        .kiosk-brand h1 { font-size: 3rem; font-weight: 900; letter-spacing: -1px; }
        .kiosk-brand h1 span { color: var(--kfc-red); }
        .kiosk-brand p { color: var(--text-light); font-size: 1.1rem; margin-top: 10px; font-weight: 500; }

        .kiosk-graphic {
            width: 160px; height: 160px; background: rgba(228, 0, 43, 0.1); border: 2px solid rgba(228, 0, 43, 0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 4rem;
            box-shadow: 0 0 40px rgba(228, 0, 43, 0.2); animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(228, 0, 43, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(228, 0, 43, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(228, 0, 43, 0); }
        }

        .swipe-instruction { text-align: center; margin-bottom: 30px; cursor: pointer; }
        .swipe-arrow { font-size: 1.8rem; color: var(--kfc-red); animation: bounce 1.5s infinite; margin-bottom: 8px; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .swipe-instruction p { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; color: #e4e4e7; text-transform: uppercase; }

        /* Main Menu Content Behind Welcome Screen */
        .main-app-container { width: 100%; max-width: 600px; height: 100vh; background: var(--bg); color: var(--text); display: flex; flex-direction: column; padding: 12px; padding-bottom: 80px; overflow-y: auto; }
        
        header { background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        .header-nav { display: flex; gap: 8px; align-items: center; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        /* Cart Icon with Red Notification Badge */
        .cart-icon-btn { position: relative; background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: background 0.2s; }
        .cart-icon-btn:hover { background: rgba(255,255,255,0.2); }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--kfc-red); color: white; font-size: 0.7rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--kfc-dark); }

        /* Gear Icon & Menu Dropdown */
        .settings-menu-container { position: relative; }
        .gear-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .gear-btn:hover { background: rgba(255,255,255,0.2); }
        
        .dropdown-content { display: none; position: absolute; right: 0; top: 45px; background: white; min-width: 140px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; z-index: 100; }
        .dropdown-content a { color: var(--text); padding: 10px 14px; text-decoration: none; display: block; font-size: 0.85rem; font-weight: 600; }
        .dropdown-content a:hover { background: #f4f4f5; color: var(--kfc-red); }
        .dropdown-content.show { display: block; }

        .store-alert { padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; text-align: center; margin-top: 12px; }
        .store-alert.closed { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .store-alert.open { background: #d1fae5; color: var(--success); border: 1px solid #a7f3d0; }

        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-top: 12px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; font-weight: 800; }

        /* Menu Item Layout */
        .menu-item { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fafafa; align-items: center; }
        .menu-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #e4e4e7; flex-shrink: 0; }
        .menu-details { flex-grow: 1; }
        .category-tag { display: inline-block; background: #fee2e2; color: var(--kfc-red); font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; text-transform: uppercase; }
        .menu-details h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); }
        .menu-details p { font-size: 0.75rem; color: var(--text-light); margin: 2px 0 6px 0; line-height: 1.2; }
        .price { font-weight: 800; font-size: 0.9rem; color: var(--text); }

        .btn { padding: 8px 12px; border: none; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; transition: opacity 0.2s; }
        .btn-primary { background: var(--kfc-red); color: white; }
        .btn-primary:hover { background: var(--kfc-red-hover); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Inline Item Quantity Action Container */
        .item-action-area { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .inline-qty-box { display: flex; align-items: center; background: #f4f4f5; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        
        /* Red Quantity Control Buttons */
        .qty-action-btn { background: var(--kfc-red); color: white; border: none; width: 30px; height: 32px; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .qty-action-btn:hover { background: var(--kfc-red-hover); }
        .qty-display-num { padding: 0 10px; font-size: 0.85rem; font-weight: 800; color: var(--text); min-width: 24px; text-align: center; }
    </style>
</head>
<body>

    <!-- KIOSK WELCOME SCREEN -->
    <div id="welcomeScreen" class="kiosk-welcome">
        <div class="kiosk-brand">
            <h1>Quick<span>Bites</span></h1>
            <p>Welcome to Self-Service Ordering</p>
        </div>
        <div class="kiosk-graphic">🍗</div>
        <div class="swipe-instruction" id="swipeTrigger">
            <div class="swipe-arrow">▲</div>
            <p>Swipe up to start order</p>
        </div>
    </div>

    <!-- MAIN ORDERING APP CONTAINER -->
    <div class="main-app-container">
        <header>
            <h1>🍗 Quick<span>Bites</span></h1>
            <div class="header-nav">
                <a href="order-tracking.html" class="nav-btn">📦 Track</a>
                
                <!-- CART ICON WITH BADGE -->
                <a href="cart.html" class="cart-icon-btn" title="View Cart">
                    🛒
                    <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
                </a>

                <!-- GEAR ICON WITH ADMIN DROPDOWN -->
                <div class="settings-menu-container">
                    <button type="button" class="gear-btn" id="gearBtn" title="Settings">⚙️</button>
                    <div id="adminDropdown" class="dropdown-content">
                        <a href="admin.html">🔐 Admin Login</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- STORE STATUS BANNER -->
        <div id="storeAlertContainer">
            <div class="store-alert closed">Checking store status...</div>
        </div>

        <!-- MENU LIST -->
        <div class="card">
            <h2>📜 Our Menu</h2>
            <div id="menuContainer">Loading menu...</div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isStoreOpen = false;
        let menuCache = [];

        // --- SWIPE / TAP TO START KIOSK SCREEN ---
        const welcomeScreen = document.getElementById('welcomeScreen');
        const swipeTrigger = document.getElementById('swipeTrigger');

        function dismissWelcome() {
            welcomeScreen.classList.add('slide-up');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
            }, 600);
        }

        swipeTrigger.addEventListener('click', dismissWelcome);
        
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 50) {
                dismissWelcome();
            }
        });

        // --- UPDATE CART BADGE COUNT ---
        window.updateCartBadge = function() {
            let cart = JSON.parse(localStorage.getItem("quickbites_cart")) || [];
            let totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const badge = document.getElementById('cartBadge');
            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }
        updateCartBadge();

        // --- GEAR DROPDOWN TOGGLE INTERACTION ---
        const gearBtn = document.getElementById('gearBtn');
        const adminDropdown = document.getElementById('adminDropdown');

        gearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            adminDropdown.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            if (adminDropdown.classList.contains('show')) {
                adminDropdown.classList.remove('show');
            }
        });

        // --- CHECK STORE STATUS & LISTEN TO CHANGES ---
        function initStoreListener() {
            onSnapshot(doc(db, "settings", "storeStatus"), (docSnap) => {
                const alertContainer = document.getElementById('storeAlertContainer');
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    isStoreOpen = data.isOpen || false;

                    if (isStoreOpen) {
                        alertContainer.innerHTML = `<div class="store-alert open">🟢 Store is OPEN! Add items to cart.</div>`;
                    } else {
                        alertContainer.innerHTML = `<div class="store-alert closed">🔴 Store is currently CLOSED. Ordering is disabled.</div>`;
                    }
                    if (menuCache.length === 0) {
                        loadMenu();
                    } else {
                        updateAllActionButtons();
                    }
                } else {
                    alertContainer.innerHTML = `<div class="store-alert closed">🔴 Store status unavailable.</div>`;
                }
            });
        }

        // --- CONVERT GOOGLE DRIVE LINK TO DIRECT EMBED IMAGE URL ---
        function getDirectImageUrl(url) {
            if (!url) return "https://via.placeholder.com/70?text=No+Image";
            const match = url.match(/\/d\/(.*?)\/view/) || url.match(/id=([^&]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        // --- LOAD MENU ITEMS ONCE ---
        async function loadMenu() {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = "";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if (querySnapshot.empty) {
                    menuContainer.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem;'>No menu items available at the moment.</p>";
                    return;
                }

                menuCache = [];
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    p.directImg = getDirectImageUrl(p.image);
                    menuCache.push(p);
                });

                renderMenuList();
            } catch (e) {
                console.error("Error loading menu: ", e);
                menuContainer.innerHTML = "<p style='color:var(--danger); font-size:0.85rem;'>Failed to load menu items.</p>";
            }
        }

        function renderMenuList() {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = "";

            let cart = JSON.parse(localStorage.getItem("quickbites_cart")) || [];

            menuCache.forEach((p) => {
                let cartItem = cart.find(item => item.name === p.name);
                let qty = cartItem ? cartItem.quantity : 0;

                let actionHtml = getActionHtml(p, qty);
                
                menuContainer.innerHTML += `
                    <div class="menu-item" data-product-name="${p.name}">
                        <img src="${p.directImg}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/70?text=Food'">
                        <div class="menu-details">
                            <span class="category-tag">${p.category || 'General'}</span>
                            <h3>${p.name}</h3>
                            <p>${p.description || 'Delicious meal item prepared fresh.'}</p>
                            <div class="price">₹${p.price}</div>
                        </div>
                        <div class="item-action-area" id="action-area-${CSS.escape(p.name)}">
                            ${actionHtml}
                        </div>
                    </div>
                `;
            });
        }

        function getActionHtml(p, qty) {
            if (!isStoreOpen) {
                return `<button class="btn btn-primary" disabled>Closed</button>`;
            } else if (qty === 0) {
                return `<button class="btn btn-primary" onclick="updateItemQty('${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.directImg}', 1)">Add to Cart</button>`;
            } else {
                return `
                    <div class="inline-qty-box">
                        <button class="qty-action-btn" onclick="updateItemQty('${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.directImg}', -1)">-</button>
                        <span class="qty-display-num">${qty}</span>
                        <button class="qty-action-btn" onclick="updateItemQty('${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.directImg}', 1)">+</button>
                    </div>
                `;
            }
        }

        function updateAllActionButtons() {
            let cart = JSON.parse(localStorage.getItem("quickbites_cart")) || [];
            menuCache.forEach((p) => {
                let cartItem = cart.find(item => item.name === p.name);
                let qty = cartItem ? cartItem.quantity : 0;
                const actionArea = document.getElementById(`action-area-${CSS.escape(p.name)}`);
                if (actionArea) {
                    actionArea.innerHTML = getActionHtml(p, qty);
                }
            });
        }

        // --- UPDATE ITEM QUANTITY WITHOUT RE-RENDERING WHOLE PAGE (NO FLICKER) ---
        window.updateItemQty = function(name, price, image, delta) {
            if (!isStoreOpen) return;

            let cart = JSON.parse(localStorage.getItem("quickbites_cart")) || [];
            let index = cart.findIndex(item => item.name === name);

            if (index !== -1) {
                cart[index].quantity += delta;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            } else if (delta > 0) {
                cart.push({ name, price: parseFloat(price), image, quantity: 1 });
            }

            localStorage.setItem("quickbites_cart", JSON.stringify(cart));
            updateCartBadge();
            updateAllActionButtons();
        }

        initStoreListener();
    </script>
</body>
</html>
