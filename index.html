<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Welcome</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-dark: #202124;
            --bg: #18181b;
            --text-light: #71717a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg); 
            color: white; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
        }

        .kiosk-welcome {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #18181b 0%, var(--kfc-dark) 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            padding: 50px 20px; 
            z-index: 2000; 
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .kiosk-welcome.slide-up { transform: translateY(-100%); }

        .kiosk-brand { 
            text-align: center; 
            margin-top: 45px; 
            width: 100%; 
            max-width: 90vw; 
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kiosk-brand h1 { 
            font-weight: 800; 
            letter-spacing: -0.75px; 
            max-width: 100%;
            line-height: 1.25;
            white-space: nowrap; /* Ensures single line by default unless twoRows is active */
        }

        .kiosk-brand p { 
            color: var(--text-light); 
            font-size: 1.05rem; 
            margin-top: 12px; 
            font-weight: 500; 
            letter-spacing: 0.2px;
        }

        .kiosk-graphic {
            width: 160px; 
            height: 160px; 
            background: rgba(228, 0, 43, 0.1); 
            border: 2px solid rgba(228, 0, 43, 0.3);
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 4rem;
            box-shadow: 0 0 40px rgba(228, 0, 43, 0.2); 
            animation: pulse 2s infinite ease-in-out; 
            overflow: hidden;
        }
        .kiosk-graphic img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(228, 0, 43, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(228, 0, 43, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(228, 0, 43, 0); }
        }

        .swipe-instruction { text-align: center; margin-bottom: 30px; cursor: pointer; }
        .swipe-arrow { font-size: 1.8rem; color: var(--kfc-red); animation: bounce 1.5s infinite; margin-bottom: 8px; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .swipe-instruction p { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; color: #e4e4e7; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="welcomeScreen" class="kiosk-welcome">
        <div class="kiosk-brand" id="brandWrapper">
            <h1 id="brandTitleElement">
                <span id="part1Span" style="color: #ffffff;">Quick</span><span id="spaceSpan"></span><span id="part2Span" style="color: #e4002b;">Bites</span>
            </h1>
            <p id="brandDescElement">Welcome to Self-Service Ordering</p>
        </div>
        <div class="kiosk-graphic" id="graphicContainer">🍗</div>
        <div class="swipe-instruction" id="swipeTrigger">
            <div class="swipe-arrow">▲</div>
            <p>Swipe up to start order</p>
        </div>
    </div>

    <!-- Real-Time Firebase Listener Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getDirectImageUrl(url) {
            if (!url) return null;
            const match = url.match(/\/d\/(.*?)\/view/) || url.match(/id=([^&]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        onSnapshot(doc(db, "settings", "welcomeConfig"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                const t1 = data.title1 !== undefined ? data.title1 : "Quick";
                const t2 = data.title2 !== undefined ? data.title2 : "Bites";
                const hasSpace = data.hasSpace === true;
                const twoRows = data.twoRows === true;
                const alignment = data.alignment || 'center';
                const adminFontSize = data.fontSize ? Number(data.fontSize) : 2.75;

                // Handle Alignment
                const brandWrapper = document.getElementById('brandWrapper');
                const h1Elem = document.getElementById('brandTitleElement');
                const descElem = document.getElementById('brandDescElement');

                brandWrapper.style.alignItems = alignment === 'left' ? 'flex-start' : (alignment === 'right' ? 'flex-end' : 'center');
                h1Elem.style.textAlign = alignment;
                descElem.style.textAlign = alignment;

                // Handle Row layout
                const p1 = document.getElementById('part1Span');
                const spaceSpan = document.getElementById('spaceSpan');
                const p2 = document.getElementById('part2Span');

                p1.textContent = t1;
                p1.style.color = data.color1 || "#ffffff";

                p2.textContent = t2;
                p2.style.color = data.color2 || "#e4002b";

                if (twoRows) {
                    h1Elem.style.whiteSpace = "normal"; // Allow wrapping into two lines
                    spaceSpan.innerHTML = "<br>";
                    h1Elem.style.fontSize = `${adminFontSize}rem`; // Use admin configured font size directly
                } else {
                    h1Elem.style.whiteSpace = "nowrap"; // Force everything onto a single line
                    spaceSpan.textContent = hasSpace ? " " : "";
                    
                    // Auto-shrink font size dynamically to fit container width if text is long
                    let testSize = adminFontSize;
                    h1Elem.style.fontSize = `${testSize}rem`;
                    
                    // Reduce font size iteratively if it overflows the maximum screen container width
                    const maxWidth = brandWrapper.clientWidth;
                    while (h1Elem.scrollWidth > maxWidth && testSize > 1.0) {
                        testSize -= 0.1;
                        h1Elem.style.fontSize = `${testSize}rem`;
                    }
                }

                descElem.textContent = data.description || "Welcome to Self-Service Ordering";

                const graphicContainer = document.getElementById('graphicContainer');
                if (data.imageLink && data.imageLink.trim() !== "") {
                    const directUrl = getDirectImageUrl(data.imageLink);
                    graphicContainer.innerHTML = `<img src="${directUrl}" alt="Welcome Graphic" onerror="this.parentElement.innerHTML='🍗'">`;
                } else {
                    graphicContainer.innerHTML = "🍗";
                }
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        const welcomeScreen = document.getElementById('welcomeScreen');
        const swipeTrigger = document.getElementById('swipeTrigger');
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function roboticFullscreenTrigger() {
            let elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                let clickEvent = new MouseEvent('click', { view: window, bubbles: true, cancelable: true, clientX: 10, clientY: 10 });
                document.body.dispatchEvent(clickEvent);

                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
                localStorage.setItem("quickbites_fullscreen_locked", "true");
            }
        }

        setInterval(() => { roboticFullscreenTrigger(); }, 1000);
        window.addEventListener('load', roboticFullscreenTrigger);
        window.addEventListener('pointerdown', roboticFullscreenTrigger, { once: true });

        function checkCartAndRedirect() {
            let cart = JSON.parse(localStorage.getItem("quickbites_cart")) || [];
            if (cart.length > 0) {
                window.location.href = "afterswipe.html";
            }
        }
        checkCartAndRedirect();

        function dismissWelcome() {
            roboticFullscreenTrigger();
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            }
            welcomeScreen.classList.add('slide-up');
            setTimeout(() => { window.location.href = "afterswipe.html"; }, 500);
        }

        swipeTrigger.addEventListener('click', dismissWelcome);
        
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 50) { dismissWelcome(); }
        });
    </script>
</body>
</html>
