<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Admin Settings</title>
    <!-- Include iro.js Color Wheel Library -->
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; color: var(--text); font-weight: 800; }

        /* Form Controls */
        input, textarea { width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; }
        label { font-size: 0.8rem; font-weight: 700; color: var(--text-light); margin-bottom: 4px; display: block; text-transform: uppercase; }

        .title-row-group { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .title-row-group input { margin-bottom: 0; flex-grow: 1; }
        
        .color-picker-container { display: flex; flex-direction: column; align-items: center; background: #fafafa; padding: 10px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
        .color-wheel-wrapper { margin: 10px 0; display: flex; justify-content: center; }
        .selected-hex-display { font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-top: 4px; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary { background: var(--kfc-red); color: white; }
        .btn-primary:hover { background: var(--kfc-red-hover); }
        .btn-secondary { background: #e4e4e7; color: var(--text); }
        .btn-secondary:hover { background: #d4d4d8; }

        .input-with-eye { position: relative; width: 100%; margin-bottom: 12px; }
        .input-with-eye input { padding-right: 42px; margin-bottom: 0; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-light); z-index: 10; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ Admin <span>Settings</span></h1>
            <a href="admin.html" class="nav-btn">← Back</a>
        </header>

        <!-- WELCOME PAGE CUSTOMIZATION PANEL -->
        <div class="card">
            <h2>🎨 Welcome Page Customization</h2>
            
            <label>Title Part 1 (First Row)</label>
            <div class="title-row-group">
                <input type="text" id="titlePart1" placeholder="e.g. Quick">
            </div>
            <div class="color-picker-container">
                <label>Part 1 Color Wheel</label>
                <div class="color-wheel-wrapper" id="wheelPart1"></div>
                <div class="selected-hex-display" id="hexDisplay1">Selected: #ffffff</div>
            </div>

            <label>Title Part 2 (Second Row)</label>
            <div class="title-row-group">
                <input type="text" id="titlePart2" placeholder="e.g. Bites">
            </div>
            <div class="color-picker-container">
                <label>Part 2 Color Wheel</label>
                <div class="color-wheel-wrapper" id="wheelPart2"></div>
                <div class="selected-hex-display" id="hexDisplay2">Selected: #e4002b</div>
            </div>

            <label for="welcomeDesc">Welcome Description</label>
            <input type="text" id="welcomeDesc" placeholder="e.g. Welcome to Self-Service Ordering">

            <label for="welcomeImage">Welcome Graphic (Google Drive Link)</label>
            <input type="text" id="welcomeImage" placeholder="Paste Google Drive sharing URL">

            <button class="btn btn-primary" id="saveWelcomeBtn">Save Welcome Settings</button>
        </div>

        <!-- PASSWORD MANAGEMENT PANEL -->
        <div class="card">
            <h2>🔒 Change Admin Password</h2>
            
            <div class="input-with-eye">
                <input type="password" id="currentPass" placeholder="Current Password">
                <button type="button" class="toggle-password" data-target="currentPass">👁️</button>
            </div>
            
            <div class="input-with-eye">
                <input type="password" id="newPass" placeholder="New Password (Min 4 chars)">
                <button type="button" class="toggle-password" data-target="newPass">👁️</button>
            </div>
            
            <button class="btn btn-secondary" id="updatePassBtn">Update Password</button>
        </div>
    </div>

    <!-- Firebase Script Logic & Color Wheel Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Initialize iro.js Color Wheels
        let colorWheel1 = new iro.ColorPicker("#wheelPart1", {
            width: 160,
            color: "#ffffff"
        });

        let colorWheel2 = new iro.ColorPicker("#wheelPart2", {
            width: 160,
            color: "#e4002b"
        });

        // Update hex text indicators on wheel interaction
        colorWheel1.on("color:change", function(color) {
            document.getElementById('hexDisplay1').textContent = `Selected: ${color.hexString}`;
        });
        colorWheel2.on("color:change", function(color) {
            document.getElementById('hexDisplay2').textContent = `Selected: ${color.hexString}`;
        });

        // Load existing welcome settings from Firebase on start
        async function loadWelcomeSettings() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "welcomeConfig"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('titlePart1').value = data.title1 || "Quick";
                    if (data.color1) {
                        colorWheel1.color.set(data.color1);
                        document.getElementById('hexDisplay1').textContent = `Selected: ${data.color1}`;
                    }

                    document.getElementById('titlePart2').value = data.title2 || "Bites";
                    if (data.color2) {
                        colorWheel2.color.set(data.color2);
                        document.getElementById('hexDisplay2').textContent = `Selected: ${data.color2}`;
                    }

                    document.getElementById('welcomeDesc').value = data.description || "Welcome to Self-Service Ordering";
                    document.getElementById('welcomeImage').value = data.imageLink || "";
                }
            } catch (e) {
                console.error("Error loading welcome settings:", e);
            }
        }
        loadWelcomeSettings();

        // Save welcome settings to Firebase
        document.getElementById('saveWelcomeBtn').addEventListener('click', async () => {
            const title1 = document.getElementById('titlePart1').value.trim();
            const color1 = colorWheel1.color.hexString;
            const title2 = document.getElementById('titlePart2').value.trim();
            const color2 = colorWheel2.color.hexString;
            const description = document.getElementById('welcomeDesc').value.trim();
            const imageLink = document.getElementById('welcomeImage').value.trim();

            try {
                await setDoc(doc(db, "settings", "welcomeConfig"), {
                    title1: title1 || "Quick",
                    color1: color1,
                    title2: title2 || "Bites",
                    color2: color2,
                    description: description || "Welcome to Self-Service Ordering",
                    imageLink: imageLink
                }, { merge: true });

                alert("Welcome page settings updated successfully!");
            } catch (e) {
                console.error("Error saving welcome settings:", e);
                alert("Failed to update settings.");
            }
        });

        // --- PASSWORD MANAGEMENT LOGIC ---
        if (!localStorage.getItem("adminPassword")) {
            localStorage.setItem("adminPassword", "Admin@123");
        }

        document.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('.toggle-password');
            if (!toggleBtn) return;

            const targetId = toggleBtn.getAttribute('data-target');
            if (targetId) {
                const inputField = document.getElementById(targetId);
                if (inputField) {
                    if (inputField.type === "password") {
                        inputField.type = "text";
                        toggleBtn.textContent = "🙈";
                    } else {
                        inputField.type = "password";
                        toggleBtn.textContent = "👁️";
                    }
                }
            }
        });

        document.getElementById('updatePassBtn').addEventListener('click', function() {
            const currentInput = document.getElementById('currentPass').value;
            const newInput = document.getElementById('newPass').value;
            
            if (currentInput !== localStorage.getItem("adminPassword")) {
                alert("Incorrect current password!");
                return;
            }
            if (!newInput || newInput.length < 4) {
                alert("New password must be at least 4 characters long.");
                return;
            }
            
            localStorage.setItem("adminPassword", newInput);
            alert("Password updated successfully!");
            document.getElementById('currentPass').value = "";
            document.getElementById('newPass').value = "";
        });
    </script>
</body>
</html>
