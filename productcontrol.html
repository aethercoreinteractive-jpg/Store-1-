<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Product Control</title>
    <style>
        :root {
            --kfc-red: #e4002b;
            --kfc-red-hover: #c50024;
            --kfc-dark: #202124;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --border: #e4e4e7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 50px; }

        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--kfc-dark); color: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header h1 span { color: var(--kfc-red); }

        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; color: var(--text); font-weight: 800; }

        /* Form Controls */
        input, textarea, select { width: 100%; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-primary { background: var(--kfc-red); color: white; }
        .btn-primary:hover { background: var(--kfc-red-hover); }
        .btn-secondary { background: #e4e4e7; color: var(--text); }
        .btn-secondary:hover { background: #d4d4d8; }

        .form-row { display: flex; gap: 8px; margin-bottom: 12px; }

        /* Category List Pills / Rows */
        .category-list-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .category-pill { display: inline-flex; align-items: center; gap: 8px; background: #fee2e2; color: var(--kfc-red); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .category-pill button { background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer; font-size: 0.9rem; }

        /* Category Section Header inside Inventory */
        .category-section-title { font-size: 0.95rem; font-weight: 800; color: var(--kfc-red); margin: 18px 0 8px 2px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #fee2e2; padding-bottom: 4px; }
        .category-section-title:first-of-type { margin-top: 6px; }

        /* Product Mobile List Cards */
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fafafa; }
        .product-info h4 { font-size: 0.95rem; color: var(--text); }
        .product-info p { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
        .product-actions { display: flex; gap: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📦 Product <span>Control</span></h1>
            <a href="admin.html" class="nav-btn">← Back</a>
        </header>

        <!-- CATEGORY MANAGEMENT PANEL -->
        <div class="card">
            <h2>🏷️ Manage Categories</h2>
            <div class="form-row">
                <input type="text" id="categoryNameInput" placeholder="Category Name (e.g. Snacks)" style="margin-bottom:0;">
                <input type="number" id="categorySortInput" placeholder="Sort # (1, 2...)" style="margin-bottom:0; width: 110px;" value="1">
            </div>
            <button class="btn btn-primary" id="addCategoryBtn">Add Category</button>
            <div id="categoryContainer" class="category-list-container" style="margin-top: 12px;">Loading categories...</div>
        </div>

        <!-- PRODUCT MANAGEMENT PANEL -->
        <div class="card">
            <h2 id="formTitle">Add New Product</h2>
            <input type="hidden" id="editProductId">
            <input type="text" id="productName" placeholder="Product Name">
            
            <select id="productCategorySelect">
                <option value="">Select Category</option>
            </select>

            <textarea id="productDesc" placeholder="Product Description"></textarea>
            <input type="number" id="productPrice" placeholder="Price (₹)">
            <input type="text" id="productImage" placeholder="Google Drive Image Link">
            
            <div class="form-row" style="margin-bottom:0;">
                <button class="btn btn-primary" id="saveBtn">Add Product</button>
                <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
            </div>

            <h3 style="font-size: 0.95rem; margin: 24px 0 10px 0; color: var(--text-light);">Inventory Items</h3>
            <div id="productListContainer">Loading inventory...</div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCevmUKn9jsh3VrttK8MAyXEO5JjaFOTyM",
            authDomain: "store-1-4fbf7.firebaseapp.com",
            projectId: "store-1-4fbf7",
            storageBucket: "store-1-4fbf7.firebasestorage.app",
            messagingSenderId: "183172029649",
            appId: "1:183172029649:web:cc403927d797b3e53279f0",
            measurementId: "G-W34ETBHTPB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let categoryOrderMap = {}; // Maps category name to its sort number

        // Load data on startup
        async function init() {
            await loadCategories();
            await loadProducts();
        }
        init();

        // --- CATEGORY CRUD ---
        document.getElementById('addCategoryBtn').addEventListener('click', async function() {
            const catName = document.getElementById('categoryNameInput').value.trim();
            const sortNum = parseInt(document.getElementById('categorySortInput').value) || 1;

            if (!catName) {
                alert("Please enter a category name.");
                return;
            }

            try {
                await addDoc(collection(db, "categories"), { name: catName, sortOrder: sortNum });
                document.getElementById('categoryNameInput').value = "";
                document.getElementById('categorySortInput').value = "1";
                await loadCategories();
                await loadProducts();
            } catch (e) {
                console.error("Error adding category:", e);
            }
        });

        async function loadCategories() {
            const container = document.getElementById('categoryContainer');
            const selectDropdown = document.getElementById('productCategorySelect');
            categoryOrderMap = {};
            
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                container.innerHTML = "";
                selectDropdown.innerHTML = '<option value="">Select Category</option>';

                if (querySnapshot.empty) {
                    container.innerHTML = "<span style='font-size:0.8rem; color:var(--text-light);'>No categories created yet.</span>";
                    return;
                }

                let categories = [];
                querySnapshot.forEach((docSnap) => {
                    categories.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Sort categories based on sortOrder (lowest number first, e.g., 1, 2, 3...)
                categories.sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));

                categories.forEach((cat) => {
                    categoryOrderMap[cat.name] = cat.sortOrder || 99;

                    // Render Category Pill with its sort number tag
                    const pill = document.createElement('div');
                    pill.className = "category-pill";
                    pill.innerHTML = `<span>[${cat.sortOrder || 1}] ${cat.name}</span> <button title="Delete Category">×</button>`;
                    
                    pill.querySelector('button').addEventListener('click', async () => {
                        if (confirm(`Delete category "${cat.name}"?`)) {
                            await deleteDoc(doc(db, "categories", cat.id));
                            await loadCategories();
                            await loadProducts();
                        }
                    });
                    container.appendChild(pill);

                    // Add to Product Form Dropdown
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `[${cat.sortOrder || 1}] ${cat.name}`;
                    selectDropdown.appendChild(option);
                });
            } catch (e) {
                console.error("Error loading categories:", e);
                container.innerHTML = "<span style='font-size:0.8rem; color:var(--danger);'>Failed to load categories.</span>";
            }
        }

        // --- PRODUCT CRUD ---
        document.getElementById('saveBtn').addEventListener('click', async function() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategorySelect').value || 'General';
            const description = document.getElementById('productDesc').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;

            if (!name || !price) {
                alert("Please provide at least a Product Name and Price.");
                return;
            }

            try {
                if (id) {
                    await updateDoc(doc(db, "products", id), { name, category, description, price, image });
                    alert("Product updated successfully!");
                } else {
                    await addDoc(collection(db, "products"), { name, category, description, price, image });
                    alert("Product added successfully!");
                }
                clearProductForm();
                loadProducts();
            } catch (e) {
                console.error("Error saving product: ", e);
            }
        });

        async function loadProducts() {
            const container = document.getElementById('productListContainer');
            container.innerHTML = "Loading inventory...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color:var(--text-light); font-size:0.85rem;'>No products added yet.</p>";
                    return;
                }

                // Group products by category
                let categoriesGroup = {};
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    p.id = docSnap.id;
                    let cat = p.category ? p.category.trim() : "General";
                    if (!categoriesGroup[cat]) {
                        categoriesGroup[cat] = [];
                    }
                    categoriesGroup[cat].push(p);
                });

                // Sort category keys based on user-assigned sort order numbers
                let sortedCategories = Object.keys(categoriesGroup).sort((a, b) => {
                    let orderA = categoryOrderMap[a] !== undefined ? categoryOrderMap[a] : 99;
                    let orderB = categoryOrderMap[b] !== undefined ? categoryOrderMap[b] : 99;
                    return orderA - orderB;
                });

                container.innerHTML = "";

                // Render categorized inventory sections sequentially
                sortedCategories.forEach(catName => {
                    const sectionTitle = document.createElement('div');
                    sectionTitle.className = "category-section-title";
                    let sortBadgeNum = categoryOrderMap[catName] !== undefined ? `[${categoryOrderMap[catName]}] ` : '';
                    sectionTitle.innerText = `${sortBadgeNum}${catName}`;
                    container.appendChild(sectionTitle);

                    categoriesGroup[catName].forEach((p) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = "product-item";
                        itemDiv.innerHTML = `
                            <div class="product-info">
                                <h4>${p.name} (₹${p.price})</h4>
                                <p>${p.description ? p.description.substring(0, 40) + '...' : 'No description'}</p>
                            </div>
                            <div class="product-actions">
                                <button class="edit-btn" style="background:#e0e7ff; color:#4f46e5; padding:6px 12px; font-size:0.8rem; border-radius:6px; border:none; cursor:pointer; font-weight:600;">Edit</button>
                                <button class="del-btn" style="background:#fee2e2; color:#ef4444; padding:6px 12px; font-size:0.8rem; border-radius:6px; border:none; cursor:pointer; font-weight:600;">Delete</button>
                            </div>
                        `;

                        itemDiv.querySelector('.edit-btn').addEventListener('click', () => {
                            document.getElementById('editProductId').value = p.id;
                            document.getElementById('productName').value = p.name;
                            document.getElementById('productCategorySelect').value = p.category || '';
                            document.getElementById('productDesc').value = p.description || '';
                            document.getElementById('productPrice').value = p.price;
                            document.getElementById('productImage').value = p.image || '';
                            
                            document.getElementById('formTitle').innerText = "Edit Product";
                            document.getElementById('saveBtn').innerText = "Update Product";
                            document.getElementById('cancelEditBtn').style.display = "block";
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });

                        itemDiv.querySelector('.del-btn').addEventListener('click', async () => {
                            if (confirm("Are you sure you want to delete this product?")) {
                                await deleteDoc(doc(db, "products", p.id));
                                loadProducts();
                            }
                        });

                        container.appendChild(itemDiv);
                    });
                });
            } catch (e) {
                console.error("Error loading products:", e);
                container.innerHTML = "<p style='color:var(--danger); font-size:0.85rem;'>Failed to load inventory.</p>";
            }
        }

        document.getElementById('cancelEditBtn').addEventListener('click', clearProductForm);

        function clearProductForm() {
            document.getElementById('editProductId').value = "";
            document.getElementById('productName').value = "";
            document.getElementById('productCategorySelect').value = "";
            document.getElementById('productDesc').value = "";
            document.getElementById('productPrice').value = "";
            document.getElementById('productImage').value = "";
            document.getElementById('formTitle').innerText = "Add New Product";
            document.getElementById('saveBtn').innerText = "Add Product";
            document.getElementById('cancelEditBtn').style.display = "none";
        }
    </script>
</body>
</html>
